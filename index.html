<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffe3ee">
<title>Pintado con cariño</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:'Montserrat',system-ui,sans-serif;color:#9a3e68;user-select:none;-webkit-user-select:none;
 background:radial-gradient(ellipse at 50% 20%,#fff7fa,transparent 55%),linear-gradient(165deg,#ffeaf2,#ffd3e3 55%,#f8cbb9)}
.stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 78px)}
h1{margin:0;font:400 clamp(2.8rem,9vw,4.2rem)/1 'Great Vibes',cursive;background:linear-gradient(120deg,#a02f63,#f08ab1,#c44a7d);-webkit-background-clip:text;background-clip:text;color:transparent}
.frame{position:relative;padding:10px;background:#fffdfb;border-radius:6px;box-shadow:0 18px 50px rgba(150,50,95,.28),0 2px 6px rgba(0,0,0,.08);rotate:-1deg;animation:pop 1s ease-out both}
@keyframes pop{from{opacity:0;transform:translateY(20px) scale(.96)}}
canvas{display:block;background:#fff6f0}
#brush{position:absolute;left:0;top:0;font-size:30px;pointer-events:none;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25));transition:opacity .6s;translate:-6px -26px}
.bar{position:fixed;z-index:5;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;justify-content:center;gap:10px}
.bar button{border:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.7);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#9a3e68;padding:10px 20px;border-radius:999px;font:500 .85rem inherit;font-family:inherit;cursor:pointer;box-shadow:0 5px 18px rgba(160,47,99,.15)}
.petal{position:fixed;top:-30px;z-index:1;pointer-events:none;border-radius:60% 40% 60% 40%;animation:fall var(--du) linear forwards}
@keyframes fall{0%{transform:translate(0,0) rotate(0);opacity:0}12%{opacity:.8}50%{transform:translate(35px,55vh) rotate(200deg)}100%{transform:translate(-20px,108vh) rotate(420deg);opacity:0}}
</style>
</head>
<body>
<div class="stage">
  <h1 id="title"></h1>
  <div class="frame"><canvas id="cv"></canvas><div id="brush">🖌️</div></div>
</div>
<div class="bar">
  <button id="again">↺ Volver a pintar</button>
</div>

<script>
/* ✏️ PERSONALIZA AQUÍ */
const FOTO   = 'WhatsApp Image 2026-10-29 at 10.22.07 PM.jpeg';
const TITULO = 'Para ti';

const $=id=>document.getElementById(id), cv=$('cv'), ctx=cv.getContext('2d');
const rnd=(a,b)=>a+Math.random()*(b-a);
$('title').textContent=TITULO;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let img=null,cw,ch,dpr,off,gw,gh,gs,data,ang,mag,run=0;

function load(src){
  const im=new Image();
  im.onload=()=>{img=im;start()};
  im.src=src;
}

function setup(){
  const iw=img.width, ih=img.height;
  const maxW=Math.min(innerWidth*.9,900), maxH=Math.max(180,innerHeight-200);
  const sc=Math.min(maxW/iw,maxH/ih);
  cw=Math.round(iw*sc); ch=Math.round(ih*sc); dpr=Math.min(devicePixelRatio||1,2);
  cv.width=cw*dpr; cv.height=ch*dpr; cv.style.width=cw+'px'; cv.style.height=ch+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  off=document.createElement('canvas'); off.width=cv.width; off.height=cv.height;
  const o=off.getContext('2d');
  o.drawImage(img,0,0,off.width,off.height);
  gw=Math.min(cw,640); gs=gw/cw; gh=Math.max(2,Math.round(ch*gs));
  const s=document.createElement('canvas'); s.width=gw; s.height=gh;
  const sx=s.getContext('2d',{willReadFrequently:true}); sx.drawImage(off,0,0,gw,gh);
  data=sx.getImageData(0,0,gw,gh).data;
  const L=new Float32Array(gw*gh);
  for(let i=0;i<L.length;i++)L[i]=.3*data[i*4]+.59*data[i*4+1]+.11*data[i*4+2];
  ang=new Float32Array(gw*gh); mag=new Float32Array(gw*gh);
  for(let y=1;y<gh-1;y++)for(let x=1;x<gw-1;x++){
    const i=y*gw+x, gx=L[i+1]-L[i-1]+.5*(L[i-gw+1]-L[i-gw-1]+L[i+gw+1]-L[i+gw-1]),
          gy=L[i+gw]-L[i-gw]+.5*(L[i+gw-1]-L[i-gw-1]+L[i+gw+1]-L[i-gw+1]);
    mag[i]=Math.hypot(gx,gy); ang[i]=Math.atan2(gy,gx)+Math.PI/2;
  }
}

function stroke(x,y,len,w,a,angle){
  const i=Math.min(gh-1,y*gs|0)*gw+Math.min(gw-1,x*gs|0)|0, j=i*4;
  ctx.strokeStyle=`rgba(${Math.max(0,Math.min(255,data[j]+rnd(-9,9)))|0},${Math.max(0,Math.min(255,data[j+1]+rnd(-9,9)))|0},${Math.max(0,Math.min(255,data[j+2]+rnd(-9,9)))|0},${a})`;
  ctx.lineWidth=w; ctx.lineCap='round';
  const dx=Math.cos(angle)*len/2, dy=Math.sin(angle)*len/2, b=rnd(-.25,.25)*len;
  ctx.beginPath(); ctx.moveTo(x-dx,y-dy);
  ctx.quadraticCurveTo(x-Math.sin(angle)*b,y+Math.cos(angle)*b,x+dx,y+dy); ctx.stroke();
}

function pickAt(L){
  let x=rnd(0,cw),y=rnd(0,ch);
  if(L.edge){for(let k=0;k<5;k++){const x2=rnd(0,cw),y2=rnd(0,ch);
    if(mag[Math.min(gh-1,y2*gs|0)*gw+Math.min(gw-1,x2*gs|0)]>mag[Math.min(gh-1,y*gs|0)*gw+Math.min(gw-1,x*gs|0)]){x=x2;y=y2}}}
  const i=Math.min(gh-1,y*gs|0)*gw+Math.min(gw-1,x*gs|0);
  const a=L.edge&&mag[i]>25?ang[i]+rnd(-.3,.3):.8+rnd(-.6,.6);
  stroke(x,y,L.l*rnd(.7,1.3),L.w*rnd(.8,1.2),L.a,a);
  return [x,y];
}

function start(){
  const id=++run;
  try{setup()}catch(e){return}
  $('brush').style.opacity=1;
  ctx.fillStyle='#fff6f0'; ctx.fillRect(0,0,cw,ch);
  if(reduce){ctx.drawImage(off,0,0,cw,ch);$('brush').style.opacity=0;return}
  const A=cw*ch;
  const layers=[
   {w:42,l:64,a:.8,edge:0,dur:4,n:A/(42*64)*1.8},
   {w:18,l:32,a:.85,edge:1,dur:6,n:A/(18*32)*1.9},
   {w:7,l:16,a:.9,edge:1,dur:9,n:A/(7*16)*1.7},
   {w:3,l:9,a:.92,edge:1,dur:5,n:A/(3*9)*.45}];
  let li=0,done=0,t0=performance.now(),fade=0;
  function frame(now){
    if(id!==run)return;
    if(li<layers.length){
      const L=layers[li], target=Math.min(L.n,L.n*((now-t0)/1000/L.dur));
      let p=null; while(done<target){p=pickAt(L);done++}
      if(p){$('brush').style.transform=`translate(${p[0]+10}px,${p[1]+10}px)`}
      if(done>=L.n){li++;done=0;t0=now}
    }else if(fade<80){
      ctx.globalAlpha=.06; ctx.drawImage(off,0,0,cw,ch); ctx.globalAlpha=1; fade++;
      $('brush').style.opacity=Math.max(0,1-fade/30);
    }else{
      ctx.drawImage(off,0,0,cw,ch); return;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

$('again').onclick=()=>img&&start();
addEventListener('resize',()=>{clearTimeout(window._r);window._r=setTimeout(()=>img&&start(),350)});

/* pétalos suaves de fondo */
const cols=[['#ffd1e1','#ff7aa9'],['#fff0f5','#ffb1c9'],['#ffe0c4','#ff9b73']];
setInterval(()=>{
  if(document.querySelectorAll('.petal').length>=12)return;
  const c=cols[Math.floor(Math.random()*cols.length)],w=rnd(9,16),e=document.createElement('div');
  e.className='petal';e.style.cssText=`left:${rnd(0,100)}vw;width:${w}px;height:${w*1.5}px;background:linear-gradient(135deg,${c[0]},${c[1]});--du:${rnd(9,15)}s`;
  document.body.appendChild(e);setTimeout(()=>e.remove(),15500);
},1000);

load(encodeURI(FOTO));
</script>
</body>
</html>
